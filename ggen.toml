[project]
name = "unrdf-production-factory"
version = "26.8.12"
description = "ggen-owned production package manufacturing and verification for the UNRDF monorepo"
repository = "https://github.com/seanchatmangpt/unrdf"

[ontology]
source = "ontology/unrdf-package-factory.ttl"
base_iri = "https://unrdf.dev/ontology/package-factory/"

[generation]
output_dir = "."

[[generation.rules]]
name = "eslint-flat-config"
query = { file = "packs/unrdf-production/queries/factory.rq" }
template = { file = "packs/unrdf-production/templates/eslint.config.mjs.tera" }
output_file = "eslint.config.mjs"
mode = "Overwrite"

[[generation.rules]]
name = "workspace-package-verifier"
query = { file = "packs/unrdf-production/queries/factory.rq" }
template = { file = "packs/unrdf-production/templates/verify-workspace-packages.mjs.tera" }
output_file = "scripts/verify-workspace-packages.mjs"
mode = "Overwrite"

[validation]
strict_mode = true
