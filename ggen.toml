[project]
name = "unrdf-package-factory"
version = "26.8.12"
description = "Canonical UNRDF package graph projection and production-readiness evidence"

[ontology]
source = ".artifacts/package-observation/package-topology.ttl"

[generation]
output_dir = "."

[inference]
rules = [
  { name = "identity", construct = "CONSTRUCT { ?s ?p ?o } WHERE { ?s ?p ?o } ORDER BY ?s ?p ?o" }
]

[[generation.rules]]
name = "package-exports"
query = { inline = """
PREFIX dcterms: <http://purl.org/dc/terms/>
PREFIX doap: <http://usefulinc.com/ns/doap#>
PREFIX unrdf: <https://unrdf.dev/ontology/package-readiness#>
SELECT ?name ?version ?path ?tier ?private ?entry ?manifest_digest ?dependencies_json ?reverse_dependencies_json ?dependency_count ?reverse_dependency_count ?scc_id ?scc_size ?cyclic ?has_lint ?has_build ?has_test WHERE {
  ?pkg a doap:Project ;
       dcterms:identifier ?name ;
       doap:revision ?version ;
       unrdf:path ?path ;
       unrdf:tier ?tier ;
       unrdf:private ?private ;
       unrdf:entry ?entry ;
       unrdf:manifestDigest ?manifest_digest ;
       unrdf:internalDependenciesJson ?dependencies_json ;
       unrdf:reverseDependenciesJson ?reverse_dependencies_json ;
       unrdf:internalDependencyCount ?dependency_count ;
       unrdf:reverseDependencyCount ?reverse_dependency_count ;
       unrdf:sccId ?scc_id ;
       unrdf:sccSize ?scc_size ;
       unrdf:cyclic ?cyclic ;
       unrdf:hasLint ?has_lint ;
       unrdf:hasBuild ?has_build ;
       unrdf:hasTest ?has_test .
}
ORDER BY ?name
""" }
template = { file = "templates/package-exports.mjs.tera" }
output_file = "src/generated/package-exports.mjs"
mode = "Overwrite"
