[project]
name = "unrdf-project2-lineage"
version = "26.8.27"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "propagation-plan"
query = { file = ".ggen/packs/capability-lineage-propagation-pack/queries/30-clean-plan.rq" }
template = { file = ".ggen/packs/capability-lineage-propagation-pack/templates/propagation-plan.json.tera" }
output_file = "generated/propagation/plan.json"

[[generation.rules]]
name = "propagation-court"
query = { file = ".ggen/packs/capability-lineage-propagation-pack/queries/30-clean-plan.rq" }
template = { file = ".ggen/packs/capability-lineage-propagation-pack/templates/propagation-court.py.tera" }
output_file = "generated/propagation/qualification_court.py"
