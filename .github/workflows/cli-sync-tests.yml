name: CLI Sync Tests

# One job, one install. The whole sync suite (unit + e2e + example configs + generated-code compile + dry-run)
# is ~30 s of real work; the previous six-job layout spent far longer booting runners and reinstalling
# than testing. PR: Node 22. main: Node 20 and 22 (engines: node >=20).

on:
  push:
    branches: [main, develop]
    paths: &paths
      - 'packages/cli/**'
      - 'packages/core/src/**'
      - 'scripts/ci/sync-*.sh'
      - '.github/actions/setup/**'
      - '.github/workflows/cli-sync-tests.yml'
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sync:
    name: CLI Sync Command Tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(github.event_name == 'pull_request' && '["22"]' || '["20","22"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Sync unit + e2e tests
        working-directory: packages/cli
        run: pnpm exec vitest run --reporter=verbose test/cli/sync.test.mjs test/sync/ test/e2e/sync-e2e.test.mjs

      # Targeted name filters across the whole CLI suite: full-pipeline, error handling, dry-run.
      - name: Pipeline, error-handling and dry-run tests
        working-directory: packages/cli
        run: pnpm exec vitest run --reporter=verbose -t "process full pipeline|should fail for missing|dry-run|Dry-run"

      - name: Example configurations
        run: bash scripts/ci/sync-example-configs.sh

      - name: Generated code compiles as ESM
        run: bash scripts/ci/sync-generated-code.sh

      - name: Summary
        if: always()
        run: echo "CLI sync suite on Node ${{ matrix.node }} - ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
