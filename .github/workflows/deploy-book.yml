name: Deploy UNRDF Explorer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ATOMVM_SOURCE_REF: v0.6.6

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  atomvm-runtime:
    name: Build exact AtomVM web runtime
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake erlang-base erlang-dev git gperf

      - name: Materialize exact AtomVM source
        run: |
          set -euxo pipefail
          rm -rf .build/AtomVM-web-src
          mkdir -p .build
          git clone --depth 1 --branch "$ATOMVM_SOURCE_REF" https://github.com/atomvm/AtomVM.git .build/AtomVM-web-src
          git -C .build/AtomVM-web-src rev-parse HEAD | tee .build/atomvm-browser-source.sha
          test "$(git -C .build/AtomVM-web-src describe --tags --exact-match)" = "$ATOMVM_SOURCE_REF"

      - name: Build real Emscripten web runtime
        working-directory: .build/AtomVM-web-src/src/platforms/emscripten
        run: |
          set -euxo pipefail
          mkdir -p build
          cd build
          emcmake cmake .. -DAVM_EMSCRIPTEN_ENV=web -DCMAKE_BUILD_TYPE=Release
          emmake make -j2
          test -s src/AtomVM.js
          test -s src/AtomVM.wasm

      - name: Compile Erlang peer and stage runtime
        run: |
          set -euxo pipefail
          mkdir -p packages/atomvm/public/runtime
          erlc -o packages/atomvm/public/runtime packages/atomvm/examples/erlang/atomvm_ocel_peer.erl
          find .build/AtomVM-web-src/src/platforms/emscripten/build/src \
            -maxdepth 1 -type f -name 'AtomVM*' -exec cp {} packages/atomvm/public/runtime/ \;
          {
            echo "unrdf_head=$GITHUB_SHA"
            echo "atomvm_ref=$ATOMVM_SOURCE_REF"
            echo "atomvm_sha=$(cat .build/atomvm-browser-source.sha)"
            emcc --version | head -n 1 | sed 's/^/emscripten=/'
          } > packages/atomvm/public/runtime/identity.txt
          sha256sum packages/atomvm/public/runtime/* > packages/atomvm/public/runtime/sha256sums.txt
          test -s packages/atomvm/public/runtime/AtomVM.js
          test -s packages/atomvm/public/runtime/AtomVM.wasm
          test -s packages/atomvm/public/runtime/atomvm_ocel_peer.beam

      - name: Upload browser runtime
        uses: actions/upload-artifact@v4
        with:
          name: atomvm-pages-runtime-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: packages/atomvm/public/runtime/

  build-site:
    name: Compose Pages artifact
    needs: atomvm-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install AtomVM workspace closure
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile --filter @unrdf/atomvm...

      - name: Download exact browser runtime
        uses: actions/download-artifact@v4
        with:
          name: atomvm-pages-runtime-${{ github.sha }}
          path: packages/atomvm/public/runtime

      - name: Build AtomVM explorer for Pages base path
        env:
          ATOMVM_EXPLORER_BASE: /unrdf/atomvm/
        run: pnpm -C packages/atomvm build:vite

      - name: Install Rust for mdBook when a book exists
        if: ${{ hashFiles('book/src/SUMMARY.md') != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook when a book exists
        if: ${{ hashFiles('book/src/SUMMARY.md') != '' }}
        run: cargo install mdbook --version 0.4.37 --locked

      - name: Compose public site
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site/atomvm
          if test -f book/src/SUMMARY.md; then
            mdbook build book -d "$GITHUB_WORKSPACE/_site"
          else
            cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>UNRDF</title>
          <meta http-equiv="refresh" content="0; url=./atomvm/">
          <p><a href="./atomvm/">Open the UNRDF AtomVM OCEL v2 Peer Explorer</a></p>
          HTML
          fi
          cp -a packages/atomvm/dist/. _site/atomvm/
          test -s _site/atomvm/index.html
          test -s _site/atomvm/runtime/AtomVM.js
          test -s _site/atomvm/runtime/AtomVM.wasm
          test -s _site/atomvm/runtime/atomvm_ocel_peer.beam
          find _site/atomvm -maxdepth 2 -type f | sort | head -100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy exact site artifact
    needs: build-site
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  validate-deployed:
    name: Browser replay against public Pages origin
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install AtomVM test closure
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile --filter @unrdf/atomvm...

      - name: Install Chromium
        run: pnpm -C packages/atomvm exec playwright install --with-deps chromium

      - name: Execute two-peer proof on deployed origin
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}atomvm/
        run: |
          set -euxo pipefail
          pnpm -C packages/atomvm exec playwright test \
            test/playwright/atomvm.spec.mjs \
            test/playwright/ocel-p2p.spec.mjs \
            --project=chromium

      - name: Upload deployed-origin browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomvm-pages-browser-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            packages/atomvm/playwright-report/
            packages/atomvm/test-results/
