name: Apply dense UNRDF tranche two

on:
  pull_request:
    branches: [main]
    paths:
      - '.agent-density2/**'
      - '.github/workflows/apply-dense2-capabilities.yml'

permissions:
  contents: write

concurrency:
  group: dense-unrdf-tranche-two-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Guard exact admitted parent
        run: test "$(git rev-parse HEAD^)" = "82f3cbb9d315daec2e12925871e6ee9accaec1bf"
      - name: Reconstruct and verify patch identity
        run: |
          cat .agent-density2/part-* | base64 --decode | gzip --decompress > /tmp/dense2.patch
          echo '74b8b33e5225daed347ca0e2d5992c803644640e2bd6d5c312829257c1d60632  /tmp/dense2.patch' | sha256sum --check
          git apply --check /tmp/dense2.patch
          git apply --index /tmp/dense2.patch
      - name: Execute combined dense capability suite
        run: |
          node --test \
            packages/streaming/test/shacl-core.node.test.mjs \
            packages/serverless/test/dynamodb-core.node.test.mjs \
            packages/v6-compat/test/schema-codec.node.test.mjs \
            packages/kgc-probe/test/orchestration-core.node.test.mjs \
            packages/core/test/transaction-core.node.test.mjs \
            packages/streaming/test/checkpointed-pipeline.node.test.mjs \
            packages/federation/test/query-planner-core.node.test.mjs \
            packages/receipts/test/receipt-verifier.node.test.mjs
      - name: Validate source and manifests
        run: |
          git diff --cached --name-only -- '*.mjs' | while read -r file; do node --check "$file"; done
          git diff --cached --name-only -- '*/package.json' | while read -r file; do python3 -m json.tool "$file" >/dev/null; done
      - name: Remove transport and publish production commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git rm -r .agent-density2 .github/workflows/apply-dense2-capabilities.yml
          git config user.name "unrdf-capability-manufacturer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: implement transactional, checkpointed, federated, and receipt capabilities"
          git push --force-with-lease=refs/heads/agent/fix-all-packages:${EXPECTED_HEAD} origin HEAD:agent/fix-all-packages
