name: Deploy Benchmark Dashboard to GitHub Pages

# Generates benchmarks/dashboard.html from benchmarks/results/benchmark-results.json
# (benchmarks/generate-dashboard.mjs) and publishes it as the Pages site.

on:
  push:
    branches:
      - main
    paths:
      - 'benchmarks/generate-dashboard.mjs'
      - 'benchmarks/results/benchmark-results.json'
      - '.github/workflows/deploy-benchmark-dashboard.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'benchmarks/generate-dashboard.mjs'
      - 'benchmarks/results/benchmark-results.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate dashboard
        run: node benchmarks/generate-dashboard.mjs

      - name: Stage site
        run: |
          mkdir -p site
          cp benchmarks/dashboard.html site/index.html
          ls -la site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
