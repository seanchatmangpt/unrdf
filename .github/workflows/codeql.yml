name: CodeQL

# CodeQL is the longest single analysis in a PR (~5 min) but only has something to say when JavaScript changed.
# Path-gated on pull requests; always on main and weekly so a docs-only merge can never leave the default
# branch without a recent analysis.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.jsx'
      - 'pnpm-lock.yaml'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: SAST Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript
