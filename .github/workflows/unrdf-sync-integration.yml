name: UNRDF package factory — ggen receipt crown

on:
  push:
    paths:
      - 'packages/*/package.json'
      - 'ggen.toml'
      - 'templates/package-exports.mjs.tera'
      - 'scripts/unrdf-package-discovery.mjs'
      - 'scripts/unrdf-generate-integration.mjs'
      - 'scripts/verify-workspace-packages.mjs'
      - 'src/unrdf-package-registry.mjs'
      - 'src/unrdf-dependency-resolver.mjs'
      - 'src/generated/package-exports.mjs'
      - 'test/package-factory.test.mjs'
      - '.github/workflows/unrdf-sync-integration.yml'
  pull_request:
    paths:
      - 'packages/*/package.json'
      - 'ggen.toml'
      - 'templates/package-exports.mjs.tera'
      - 'scripts/unrdf-package-discovery.mjs'
      - 'scripts/unrdf-generate-integration.mjs'
      - 'scripts/verify-workspace-packages.mjs'
      - 'src/unrdf-package-registry.mjs'
      - 'src/unrdf-dependency-resolver.mjs'
      - 'src/generated/package-exports.mjs'
      - 'test/package-factory.test.mjs'
      - '.github/workflows/unrdf-sync-integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-factory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GGEN_VERSION: v26.8.12
      GGEN_SHA256: 2914f5ccb1a3d045888fe0c263da52514c6ba3d29964ca2eff2b575b94cdf067

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned ggen release
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ggen-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --location --retry 3 \
            "https://github.com/seanchatmangpt/ggen/releases/download/${GGEN_VERSION}/ggen-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "${GGEN_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p /tmp/ggen "$HOME/.local/bin"
          tar -xzf "$archive" -C /tmp/ggen
          binary=$(find /tmp/ggen -type f -name ggen -perm -u+x -print -quit)
          test -n "$binary"
          install -m 0755 "$binary" "$HOME/.local/bin/ggen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ggen" --version

      - name: Observe workspace into admitted RDF graph
        id: observe
        shell: bash
        run: |
          set +e
          node scripts/unrdf-package-discovery.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -f .artifacts/package-observation/package-topology.ttl
          test -f .artifacts/package-observation/receipt.json
          exit 0

      - name: Prove observation calculus
        run: pnpm exec vitest run test/package-factory.test.mjs

      - name: Manufacture projections with ggen
        run: ggen sync run

      - name: Prove generated JavaScript surface
        run: |
          node --check src/generated/package-exports.mjs
          node --input-type=module --eval "const m=await import('./src/generated/package-exports.mjs'); if(!m.ALL_PACKAGES.length) process.exit(1); console.log('projected', m.ALL_PACKAGES.length, 'packages')"

      - name: Prove ggen replay idempotence
        shell: bash
        run: |
          set -euo pipefail
          cp src/generated/package-exports.mjs /tmp/package-exports.first.mjs
          ggen sync run
          cmp /tmp/package-exports.first.mjs src/generated/package-exports.mjs

      - name: Execute bounded package readiness matrix
        id: matrix
        shell: bash
        run: |
          set +e
          node scripts/verify-workspace-packages.mjs --concurrency=6 --timeout-ms=120000
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -f .artifacts/package-matrix/receipt.json
          exit 0

      - name: Assert projections are committed and replayable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- src/generated/package-exports.mjs

      - name: Upload package factory receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-factory-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            .artifacts/package-observation/
            src/generated/package-exports.mjs
            .artifacts/package-matrix/
            .ggen-v2/
            .ggen/

      - name: Report scoped standing
        if: always()
        shell: bash
        run: |
          echo "factory=ALIVE if this job reaches the projection-drift crown"
          echo "package_observation_exit=${{ steps.observe.outputs.exit_code }} (product observation; nonzero does not revoke projection authority)"
          echo "package_matrix_exit=${{ steps.matrix.outputs.exit_code }} (dependency-closed product standing; receipt uploaded)"
