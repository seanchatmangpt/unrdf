name: UNRDF package factory — ggen receipt crown

on:
  push:
    paths:
      - 'packages/*/package.json'
      - 'ggen.toml'
      - 'templates/package-exports.mjs.tera'
      - 'scripts/unrdf-package-discovery.mjs'
      - 'scripts/unrdf-generate-integration.mjs'
      - 'src/unrdf-package-registry.mjs'
      - 'src/unrdf-dependency-resolver.mjs'
      - 'src/unrdf-package-validator.mjs'
      - 'src/generated/package-exports.mjs'
      - 'test/package-factory.test.mjs'
      - 'test/unrdf-package-system.test.mjs'
      - '.github/workflows/unrdf-sync-integration.yml'
  pull_request:
    paths:
      - 'packages/*/package.json'
      - 'ggen.toml'
      - 'templates/package-exports.mjs.tera'
      - 'scripts/unrdf-package-discovery.mjs'
      - 'scripts/unrdf-generate-integration.mjs'
      - 'src/unrdf-package-registry.mjs'
      - 'src/unrdf-dependency-resolver.mjs'
      - 'src/unrdf-package-validator.mjs'
      - 'src/generated/package-exports.mjs'
      - 'test/package-factory.test.mjs'
      - 'test/unrdf-package-system.test.mjs'
      - '.github/workflows/unrdf-sync-integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  construct-package-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GGEN_VERSION: v26.8.12
      GGEN_RELEASE_COMMIT: ebcc48c35fa3f2781fda52ce4826d347abb8faf6
      GGEN_ASSET_ID: '511958450'
      GGEN_SHA256: 2914f5ccb1a3d045888fe0c263da52514c6ba3d29964ca2eff2b575b94cdf067

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GITHUB_HEAD_SHA }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned ggen release through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=/tmp/ggen-x86_64-unknown-linux-gnu.tar.gz
          api="https://api.github.com/repos/seanchatmangpt/ggen/releases/assets/${GGEN_ASSET_ID}"
          curl --fail --location --http1.1 --retry 5 --retry-all-errors --retry-delay 2 \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api" --output "$archive"
          echo "${GGEN_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p /tmp/ggen "$HOME/.local/bin"
          tar -xzf "$archive" -C /tmp/ggen
          binary=$(find /tmp/ggen -type f -name ggen -perm -u+x -print -quit)
          test -n "$binary"
          install -m 0755 "$binary" "$HOME/.local/bin/ggen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          actual_version=$("$HOME/.local/bin/ggen" --version)
          printf '%s\n' "$actual_version"
          printf '%s\n' "$actual_version" | grep -F '26.8.12'
          echo "GGEN_TOOLCHAIN_RECEIPT version=${GGEN_VERSION} release_commit=${GGEN_RELEASE_COMMIT} asset_id=${GGEN_ASSET_ID} sha256=${GGEN_SHA256}"

      - name: Observe workspace into admitted RDF graph
        id: observe
        shell: bash
        run: |
          set +e
          node scripts/unrdf-package-discovery.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -f .artifacts/package-observation/package-topology.ttl
          test -f .artifacts/package-observation/receipt.json
          exit 0

      - name: Prove observation and package-system calculus
        run: pnpm exec vitest run test/package-factory.test.mjs test/unrdf-package-system.test.mjs

      - name: Manufacture projections with ggen
        run: ggen sync run

      - name: Prove generated JavaScript surface
        run: |
          node --check src/generated/package-exports.mjs
          node --input-type=module --eval "const m=await import('./src/generated/package-exports.mjs'); if(!m.ALL_PACKAGES.length) process.exit(1); console.log('projected', m.ALL_PACKAGES.length, 'packages')"

      - name: Prove ggen replay idempotence
        shell: bash
        run: |
          set -euo pipefail
          cp src/generated/package-exports.mjs /tmp/package-exports.first.mjs
          ggen sync run
          cmp /tmp/package-exports.first.mjs src/generated/package-exports.mjs

      - name: Bootstrap exact generated projection
        id: projection
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/generated/package-exports.mjs; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/generated/package-exports.mjs
          git commit -m 'chore: project canonical package graph with ggen'
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Upload package factory receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-factory-${{ env.GITHUB_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            .artifacts/package-observation/
            src/generated/package-exports.mjs
            .ggen-v2/
            .ggen/

      - name: Report construction standing
        if: always()
        shell: bash
        run: |
          echo "subject=${GITHUB_HEAD_SHA}"
          echo "SELECT=package manifests"
          echo "CONSTRUCT=observation RDF -> ggen SPARQL/Tera projection"
          echo "DO=separate Workspace Package Matrix workflow"
          echo "projection_changed=${{ steps.projection.outputs.changed }}"
          echo "package_observation_exit=${{ steps.observe.outputs.exit_code }}"
