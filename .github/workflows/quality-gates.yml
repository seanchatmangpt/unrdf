name: Quality Gates

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (with timeout)
        run: timeout 300s pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm --filter @unrdf/core --filter @unrdf/hooks run lint

      - name: Run tests
        run: pnpm --filter @unrdf/core --filter @unrdf/hooks test

      - name: Check coverage
        run: pnpm --filter @unrdf/core --filter @unrdf/hooks run test:coverage

      - name: Validate RDF migration
        run: |
          # n3 may only be imported by the justified-only module (static or dynamic import);
          # JSDoc type references and lint-rule descriptions are not imports.
          violations=$(grep -rEn "^[[:space:]]*[^*[:space:]/].*(from +|import\( *)['\"]n3['\"]" packages/*/src --include="*.mjs" | grep -v justified | grep -v lint-rules | tee /dev/stderr | wc -l)
          if [ "$violations" -gt 0 ]; then
            echo "Found $violations RDF migration violations"
            exit 1
          fi

      - name: Check file sizes
        run: |
          large_files=$(find packages/core/src packages/hooks/src -name "*.mjs" -exec wc -l {} + | awk '$1 > 500 && $2 != "total" {print}' | wc -l)
          if [ "$large_files" -gt 0 ]; then
            echo "::warning::Found $large_files files over 500 lines"
          fi
