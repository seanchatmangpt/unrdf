name: R83 TCPS Ready-Set Consumer
on:
  pull_request:
    paths:
      - 'verification/r83-tcps-ready-set/**'
      - '.github/workflows/r83-tcps-ready-set-consumer.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Materialize exact consumer subject without gitlink traversal
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p _subject
          curl --fail --silent --show-error --location \
            "https://github.com/seanchatmangpt/unrdf/archive/${SUBJECT_SHA}.tar.gz" \
            | tar -xz --strip-components=1 -C _subject
          printf '%s\n' "$SUBJECT_SHA" > _subject/.admitted-head
      - name: Admit exact consumer head
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(cat _subject/.admitted-head)" = "$SUBJECT_SHA"
      - name: Execute target-local admission court
        working-directory: _subject
        run: python3 verification/r83-tcps-ready-set/verify.py
      - name: Prove observed local GGEN contract exists
        run: test -s _subject/ggen.toml
      - name: Materialize exact canonical producer
        run: |
          set -euo pipefail
          mkdir -p _r78_producer
          curl --fail --silent --show-error --location \
            "https://github.com/seanchatmangpt/ggen-marketplace/archive/aef231ceb3e27150366a11b547dd115720230880.tar.gz" \
            | tar -xz --strip-components=1 -C _r78_producer
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install bounded producer verifier
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'rdflib==7.1.4'
      - name: Execute canonical R78 producer court
        run: pytest -q _r78_producer/packs/portfolio-epistemic-observability-pack/tests/test_r78_tcps_ready_set_capital.py
      - name: Prove zero ambient consequential actuation
        run: test "$(python -c 'import json; print(str(json.load(open("_subject/verification/r83-tcps-ready-set/subject.json"))["consequential_do"]).lower())')" = "false"
