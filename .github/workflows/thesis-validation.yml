name: Thesis Production Validation

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: timeout 60s pnpm run lint

      - name: Run tests
        run: timeout 120s pnpm test

      - name: Run OTEL validation
        run: timeout 60s node validation/run-all.mjs comprehensive

      - name: Run thesis validation
        run: timeout 30s node validation/thesis-validation.mjs

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            validation-output.log
            coverage/otel-report.json
            thesis-validation-report.txt

      - name: Comment PR with validation results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            let report = 'Thesis validation failed.';
            if (fs.existsSync('thesis-validation-report.txt')) {
              report += '\n\n' + fs.readFileSync('thesis-validation-report.txt', 'utf8');
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report,
            });

  thesis-quality-gate:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Enforce quality standards
        run: |
          echo 'Thesis validation passed - all admitted metrics verified'
