name: Thesis Production Validation

# push: main only. Pull requests are covered by the pull_request trigger; the old push: ['**'] ran the whole job
# twice for every commit on a PR branch. lint and the full test suite are no longer repeated here (ci.yml owns them).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write # PR comments go through the issues API but need this on pull requests

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: '20'

      - name: Run OTEL validation
        run: timeout 60s node validation/run-all.mjs comprehensive

      - name: Run thesis validation
        run: timeout 30s node validation/thesis-validation.mjs

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            validation-output.log
            coverage/otel-report.json
            thesis-validation-report.txt

      - name: Comment PR with validation results
        if: github.event_name == 'pull_request' && failure()
        continue-on-error: true # fork PRs get a read-only token; a missing comment must not mask the real failure
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            let report = 'Thesis validation failed.';
            if (fs.existsSync('thesis-validation-report.txt')) {
              report += '\n\n' + fs.readFileSync('thesis-validation-report.txt', 'utf8');
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report,
            });

  thesis-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Enforce quality standards
        run: echo 'Thesis validation passed - all admitted metrics verified'
