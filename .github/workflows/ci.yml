name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.15.0'
  ESLINT_USE_FLAT_CONFIG: 'false'
  HUSKY: '0'

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read admitted toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(awk '$1 == "nodejs" { print $2 }' .tool-versions)"
          test -n "$node_version"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Admit change set
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base_sha"
          fi

          git diff --check "$base_sha" HEAD
          git diff --name-only --diff-filter=ACMRT "$base_sha" HEAD > "$RUNNER_TEMP/changed-files"

          echo "Admitted changed files:"
          cat "$RUNNER_TEMP/changed-files"

          actual_workflows="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' | sort)"
          expected_workflows="$(printf '%s\n' ci.yml delivery.yml evidence.yml | sort)"
          if [[ "$actual_workflows" != "$expected_workflows" ]]; then
            echo "::error::CI_WORKFLOW_SURFACE_REFUSED"
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_workflows" "$actual_workflows"
            exit 1
          fi

      - name: Validate changed syntax and manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            case "$file" in
              *.js|*.mjs|*.cjs)
                node --check "$file"
                ;;
              package.json|*/package.json)
                node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$file"
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"

      - name: Validate changed workspaces
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t package_dirs < <(
            awk -F/ '$1 == "packages" && NF >= 3 { print $1 "/" $2 }' "$RUNNER_TEMP/changed-files" | sort -u
          )

          if [[ ${#package_dirs[@]} -eq 0 ]]; then
            echo "No package workspace changes admitted; package gates skipped."
            exit 0
          fi

          has_script() {
            node -e "const p=JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')); process.exit(p.scripts?.[process.argv[2]] ? 0 : 1)" "$1/package.json" "$2"
          }

          for package_dir in "${package_dirs[@]}"; do
            [[ -f "$package_dir/package.json" ]] || continue
            echo "Validating changed workspace: $package_dir"

            if has_script "$package_dir" lint; then
              timeout 30s pnpm --dir "$package_dir" run lint
            fi

            if has_script "$package_dir" test:fast; then
              timeout 60s pnpm --dir "$package_dir" run test:fast
            elif has_script "$package_dir" test; then
              timeout 60s pnpm --dir "$package_dir" run test
            fi

            if has_script "$package_dir" build; then
              timeout 60s pnpm --dir "$package_dir" run build
            fi
          done
