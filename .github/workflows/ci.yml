name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.15.0'
  ESLINT_USE_FLAT_CONFIG: 'false'
  HUSKY: '0'

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read admitted toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(awk '$1 == "nodejs" { print $2 }' .tool-versions)"
          test -n "$node_version"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: timeout 30s pnpm run lint

      - name: Fast tests
        run: timeout 5s pnpm run test:fast

      - name: Build
        run: timeout 60s pnpm run build
