name: CI

# One workflow is the pull-request court. Design (see docs/ci-architecture.md):
#   static    lint + format + policy + audit/security ratchets, one install, ~1-2 min
#   secrets   TruffleHog + Gitleaks (no install)
#   packages  weight-balanced shards of the workspace package matrix (lint/build/test/import)
#               PR:   Node 22, 2 shards, lint/build/test only for changed packages + dependents, import for all
#               main: Node 20/22, 3 shards, everything
#   gate      single required-check target that fails if any lane above failed
# Everything that used to re-run the same install/lint/test (checks, quality, quality-gates, package-matrix,
# code-quality, test/lint jobs here) is now one of those lanes; deep/slow reports live in scheduled.yml.

on:
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  push:
    branches: [main, develop]
  workflow_dispatch:

# A new commit makes the previous PR run obsolete. main is never cancelled: every commit gets a verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Receipts (package matrix, legacy admission) record which commits they speak about. The checkout is GitHub's
# merge ref (what will actually land), so name the PR head explicitly instead of letting scripts read HEAD.
env:
  GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Cheapest, highest-signal checks first; none of these need node_modules.
      - name: TypeScript artifacts gate
        run: |
          # Package sources must be pure ESM + JSDoc. Declaration files (*.d.ts) and tool/app
          # configs outside packages/*/src (unbuild, Next.js, Nuxt) are allowed.
          FOUND=$(find packages -path '*/node_modules' -prune -o -path 'packages/*/src/*' \( -name '*.ts' -o -name '*.tsx' \) ! -name '*.d.ts' -print)
          if [ -n "$FOUND" ]; then
            echo "❌ TypeScript artifacts found! This project uses pure ESM + JSDoc only."
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No TypeScript artifacts found"

      - name: RDF migration policy (n3 only via the justified module)
        run: |
          # n3 may only be imported by the justified-only module (static or dynamic import);
          # JSDoc type references and lint-rule descriptions are not imports.
          violations=$(grep -rEn "^[[:space:]]*[^*[:space:]/].*(from +|import\( *)['\"]n3['\"]" packages/*/src --include="*.mjs" | grep -v justified | grep -v lint-rules | tee /dev/stderr | wc -l)
          if [ "$violations" -gt 0 ]; then
            echo "Found $violations RDF migration violations"
            exit 1
          fi

      - name: File size advisory
        run: |
          large_files=$(find packages/core/src packages/hooks/src -name "*.mjs" -exec wc -l {} + | awk '$1 > 500 && $2 != "total" {print}' | wc -l)
          if [ "$large_files" -gt 0 ]; then echo "::warning::Found $large_files files over 500 lines"; fi

      - name: Legacy package admission
        run: node scripts/ggen-legacy-package-admission.mjs
      - name: Upload exact-head package receipts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ggen-legacy-package-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/ggen-legacy-package-admission
          if-no-files-found: warn

      - uses: ./.github/actions/setup

      # Lint and Prettier are independent and both CPU-light: run them concurrently.
      - name: Lint and format
        run: |
          pnpm lint > lint.log 2>&1 & lint_pid=$!
          pnpm format:check > format.log 2>&1 & format_pid=$!
          lint_rc=0; format_rc=0
          wait $lint_pid || lint_rc=$?
          wait $format_pid || format_rc=$?
          echo "::group::eslint"; cat lint.log; echo "::endgroup::"
          echo "::group::prettier"; cat format.log; echo "::endgroup::"
          [ "$lint_rc" -eq 0 ] && [ "$format_rc" -eq 0 ]

      - name: CI script tests (ratchets, change planner)
        run: node --test scripts/ci/*.test.mjs

      - name: Audit ratchet (fail only on advisories not in the baseline)
        run: node scripts/ci/audit-ratchet.mjs

      - name: Security gate (secrets strict, injection ratchet)
        run: bash scripts/ci/security-gate.sh

      - name: Validate workflow files
        run: |
          if git diff --name-only HEAD^1 HEAD 2>/dev/null | grep -qE '^\.github/(workflows|actions)/' || [ "${{ github.event_name }}" != "pull_request" ]; then
            npx --yes @action-validator/cli@0.6.0 .github/workflows/*.yml
          else
            echo "No workflow changes; skipped."
          fi

  secrets:
    name: Secrets Detection
    # TruffleHog scans base..head; on a push to main those are the same commit. main is covered by security.yml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    # Needs the repository's dependency graph; enable it, then set the repo variable DEPENDENCY_GRAPH_ENABLED=true.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0,GPL-3.0,LGPL-2.0,LGPL-3.0,AGPL-3.0

  packages:
    name: Packages (node ${{ matrix.node }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # PR: the fast court. main: the full compatibility matrix (engines: node >=20).
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"node":["22"],"shard":["1/2","2/2"]}' || '{"node":["20","22"],"shard":["1/3","2/3","3/3"]}') }}
    env:
      IS_PR: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      # Plan first (1s): which packages this shard verifies, and does it need a browser?
      - name: Plan shard
        id: plan
        run: |
          FROM=""; if [ "$IS_PR" = "true" ]; then FROM="--from=HEAD^1"; fi
          node scripts/ci/affected.mjs $FROM --shard=${{ matrix.shard }} > plan.json
          jq '{all, reason, changed, selected: (.selected|length), shard: {index: .shard.index, packages: (.shard.packages|length), selected: (.shard.selected|length)}}' plan.json
          echo "browser=$(jq '(.shard.selected | index("@unrdf/atomvm")) != null' plan.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.plan.outputs.browser == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium for the AtomVM browser tier
        if: steps.plan.outputs.browser == 'true'
        run: pnpm --filter @unrdf/atomvm exec playwright install --with-deps chromium

      - name: Verify packages
        run: |
          FLAGS="--shard=${{ matrix.shard }} --concurrency=4 --timeout-ms=300000"
          if [ "$IS_PR" = "true" ]; then FLAGS="$FLAGS --affected-from=HEAD^1"; fi
          # Lint is Node-version independent; run it once (Node 22) and use the other versions for build/test/import.
          if [ "${{ matrix.node }}" != "22" ]; then FLAGS="$FLAGS --phases=build,test,import"; fi
          node scripts/verify-workspace-packages.mjs $FLAGS

      # Root-level vitest suites (src/**) are not workspace packages; shard 1 owns them.
      - name: Root test suites
        if: startsWith(matrix.shard, '1/')
        run: pnpm test:root

      - name: Shard summary
        if: always()
        run: |
          if [ -f .artifacts/package-matrix/receipt.json ]; then
            node -e "
              const r = require('./.artifacts/package-matrix/receipt.json');
              const broken = [...r.executions, ...r.imports].filter(x => x.state === 'BUILD_BROKEN');
              const lines = ['### Packages node ${{ matrix.node }} shard ${{ matrix.shard }}', '', '| state | count |', '|---|---|', ...Object.entries(r.summary || {}).map(([k, v]) => '| ' + k + ' | ' + v + ' |')];
              if (r.selection) lines.push('', 'Selection: ' + JSON.stringify(r.selection));
              if (broken.length) lines.push('', 'BUILD_BROKEN: ' + broken.map(b => b.package + (b.phase ? ':' + b.phase : ':import')).join(', '));
              console.log(lines.join('\n'));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload receipt and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-matrix-node${{ matrix.node }}-${{ strategy.job-index }}
          path: .artifacts/package-matrix
          retention-days: 7
          if-no-files-found: warn

  gate:
    name: CI Gate
    if: always()
    needs: [static, secrets, dependency-review, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require every lane to have succeeded
        run: |
          echo "static=${{ needs.static.result }} secrets=${{ needs.secrets.result }} packages=${{ needs.packages.result }}"
          [ "${{ needs.static.result }}" = "success" ] || exit 1
          [ "${{ needs.packages.result }}" = "success" ] || exit 1
          # secrets only runs on pull requests; "skipped" is the expected result elsewhere, never "failure"/"cancelled".
          case "${{ needs.secrets.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.dependency-review.result }}" in success|skipped) ;; *) exit 1 ;; esac
      - name: Timing receipt (critical path)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" --jq '
            [.jobs[] | select(.completed_at != null and .started_at != null) |
              {name, queue_s: ((.started_at|fromdateiso8601) - (.created_at|fromdateiso8601)), run_s: ((.completed_at|fromdateiso8601) - (.started_at|fromdateiso8601))}] |
            sort_by(-.run_s) |
            "### CI timing receipt\n\n| job | queue s | run s |\n|---|---|---|\n" + (map("| \(.name) | \(.queue_s) | \(.run_s) |") | join("\n"))' >> "$GITHUB_STEP_SUMMARY" || true
