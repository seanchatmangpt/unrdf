name: Workspace Package Matrix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-package-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact UNRDF head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Checkout pinned ggen manufacturer
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/ggen
          ref: 3c456cb06c1cb325efafcdde6685ed27104450d8
          path: .tools/ggen
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Setup pinned ggen Rust toolchain
        uses: dtolnay/rust-toolchain@nightly-2026-06-22
        with:
          components: rustfmt,clippy

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact ggen
        run: cargo +nightly-2026-06-22 build --release --manifest-path .tools/ggen/Cargo.toml -p ggen-cli-lib --bin ggen

      - name: Execute ggen production projection
        run: |
          .tools/ggen/target/release/ggen graph validate --files ontology/unrdf-package-factory.ttl
          .tools/ggen/target/release/ggen sync run
          git diff --exit-code -- eslint.config.mjs scripts/verify-workspace-packages.mjs

      - name: Verify every workspace package
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-workspace-packages.mjs --concurrency=6 --timeout-ms=180000

      - name: Upload package matrix receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-package-matrix-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/package-matrix
          if-no-files-found: warn
          retention-days: 30
