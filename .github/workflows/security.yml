name: Security Scanning

# Deep scans. Not a pull-request workflow: everything that GATES a PR (audit ratchet, secrets/injection
# gate, TruffleHog/Gitleaks on the PR diff, dependency review) lives in ci.yml, and CodeQL in codeql.yml.
# What is here is slow, report-only, or only meaningful on a schedule (advisories appear without commits):
#   audit        nightly dependency audit + ratchet
#   invariants   the security gate plus the full-check / dashboard reports (~11 min, report-only)
#   advisory     licenses, supply chain, grep heuristics (none of these can fail a build) - one install, one job
#   secrets      full-history TruffleHog + Gitleaks
#   container    image build + Trivy/Scout

# Nightly and on demand only. Running these on every push to main added ~5 report-style jobs (a container build,
# an 11-minute security report, three advisory checks) to every merge; the gates themselves run in ci.yml.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: pnpm audit (report)
        run: |
          pnpm audit --audit-level moderate || echo "⚠️ Vulnerabilities found (see the ratchet below for whether any are new)"
          pnpm audit --json > audit-report.json || true
      - name: Audit ratchet
        run: node scripts/ci/audit-ratchet.mjs --input audit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

  invariants:
    name: Security Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Security gate (same script as the PR gate)
        run: bash scripts/ci/security-gate.sh
      - name: Full security invariants check (report-only)
        run: |
          node src/security/cli.mjs full-check . --json > full-security-report.json.raw || true
          sed -n '/^{/,$p' full-security-report.json.raw > full-security-report.json
          jq '{passed: .passed, overallScore: .overallScore, invariants: [.invariants[] | {name: .invariant, passed: .passed, severity: .severity}], guards: [.guards[] | {name: .name, triggered: .triggered}]}' full-security-report.json
      - name: Security dashboard (report-only)
        run: node src/security/cli.mjs dashboard . -f html -o security-dashboard.html || true
      - name: Summary
        if: always()
        run: |
          echo "## Security Invariants Check" >> "$GITHUB_STEP_SUMMARY"
          if [ -f full-security-report.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Passed:** $(jq '.passed' full-security-report.json) - **Overall score:** $(jq '.overallScore' full-security-report.json)/100" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.invariants[] | "- " + (if .passed then "✅" else "❌" end) + " " + .invariant' full-security-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            secrets-report.json
            injection-report.json
            full-security-report.json
            security-dashboard.html
          retention-days: 30

  advisory:
    name: Security Advisory Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: License compliance
        run: |
          echo "Checking dependency licenses..."
          npx license-checker --summary --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense" || {
            echo "⚠️ Potentially problematic licenses found"
            npx license-checker --production
          }
          npx license-checker --production --json > license-report.json
          npx license-checker --production --csv > license-report.csv
      - name: Supply chain
        run: |
          echo "Checking for known malicious packages..."
          npx @lavamoat/allow-scripts check || echo "⚠️ Potential issues found"
          echo "Verifying package integrity..."
          pnpm install --frozen-lockfile --verify-store-integrity
          echo "✅ Package integrity verified"
      - name: Best-practice heuristics
        run: |
          grep -r "password\s*=\s*['\"]" --include="*.mjs" --include="*.js" src/ test/ 2>/dev/null && echo "⚠️ Potential hardcoded passwords found" || true
          grep -r "api_key\s*=\s*['\"]" --include="*.mjs" --include="*.js" src/ test/ 2>/dev/null && echo "⚠️ Potential hardcoded API keys found" || true
          grep -r "secret\s*=\s*['\"]" --include="*.mjs" --include="*.js" src/ test/ 2>/dev/null && echo "⚠️ Potential hardcoded secrets found" || true
          grep -r "eval(" --include="*.mjs" --include="*.js" src/ 2>/dev/null && echo "⚠️ eval() usage found - potential security risk" || true
          grep -r "child_process.*exec" --include="*.mjs" --include="*.js" src/ 2>/dev/null && echo "⚠️ child_process exec usage found - review for command injection" || true
          grep -r "fs\.readFile.*req\." --include="*.mjs" --include="*.js" src/ 2>/dev/null && echo "⚠️ Potential path traversal vulnerability" || true
          echo "✅ Heuristic checks completed"
      - uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: |
            license-report.json
            license-report.csv
          retention-days: 30

  secrets:
    name: Secrets Detection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog (full history)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t unrdf:test .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: unrdf:test
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - name: Docker Scout
        uses: docker/scout-action@v1
        if: always()
        with:
          command: cves
          image: unrdf:test
          only-severities: critical,high
          exit-code: false

  summary:
    name: Security Summary
    if: always()
    needs: [audit, invariants, advisory, secrets, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Results
        run: |
          {
            echo "# Security Scan Summary"
            echo "| Scan | Result |"
            echo "|---|---|"
            echo "| Dependency audit | ${{ needs.audit.result }} |"
            echo "| Security invariants | ${{ needs.invariants.result }} |"
            echo "| Advisory checks | ${{ needs.advisory.result }} |"
            echo "| Secrets | ${{ needs.secrets.result }} |"
            echo "| Container | ${{ needs.container.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.audit.result }}" = "failure" ] || [ "${{ needs.invariants.result }}" = "failure" ] || [ "${{ needs.secrets.result }}" = "failure" ]; then
            echo "❌ Critical security scans failed"
            exit 1
          fi
