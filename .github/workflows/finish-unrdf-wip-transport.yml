name: Finish UNRDF WIP transport

on:
  push:
    branches:
      - agent/finish-unrdf-wip

permissions:
  contents: write

concurrency:
  group: finish-unrdf-wip-transport
  cancel-in-progress: false

jobs:
  manufacture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Admit transport identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c24c8384e1736b1b1abfe331f724b65762e3af0b"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/finish-unrdf-wip-transport.yml"

      - name: Apply bounded source edits
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              content = target.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}')
              target.write_text(content.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              target = Path(path)
              content = target.read_text()
              begin = content.find(start)
              finish = content.find(end, begin)
              if begin < 0 or finish < 0:
                  raise SystemExit(f'{path}: bounded markers not found')
              target.write_text(content[:begin] + replacement + content[finish:])

          replace_once(
              'packages/kgc-4d/test/4d-time-travel-validation.test.mjs',
              """  // ========================================
          // Test 3: Delete Operation Time-Travel (CRITICAL)
          // KNOWN LIMITATION: Delete operation replay during reconstruction is not yet fully implemented.
          // The current implementation reconstructs from snapshots but delete deltas may not apply correctly.
          // ========================================
          test.skip('Test 3: handles delete operations in time-travel reconstruction', async () => {
          """,
              """  // ========================================
          // Test 3: Delete Operation Time-Travel (CRITICAL)
          // ========================================
          test('Test 3: handles delete operations in time-travel reconstruction', async () => {
          """,
          )

          replace_once(
              'packages/core/test/sparql/semantic-query.test.mjs',
              "import { namedNode, literal, quad, blankNode } from '@unrdf/test-utils';\n",
              "import { namedNode, literal, quad, blankNode } from '@unrdf/test-utils';\nimport { OxigraphStore } from '@unrdf/oxigraph';\n",
          )
          replace_between(
              'packages/core/test/sparql/semantic-query.test.mjs',
              "    it.skip('should execute semantic CONSTRUCT query (requires OxigraphStore)', async () => {\n",
              "    it('should execute semantic SELECT query', async () => {\n",
              """    it('should execute semantic CONSTRUCT query through Oxigraph', async () => {
                const oxigraph = new OxigraphStore(store.getQuads());
                const semanticStore = {
                  getQuads: () => store.getQuads(),
                  query: (sparql, options) => oxigraph.query(sparql, options),
                };
                await initializeSemanticIndex(semanticStore);

                const sparql = `
                  PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
                  PREFIX ex: <http://example.org/>

                  CONSTRUCT { ?s ex:name ?name }
                  WHERE {
                    GRAPH ex:graph {
                      ?s rdf:type ex:Person .
                      ?s ex:name ?name .
                      FILTER(CONTAINS(STR(?name), "A"))
                    }
                  }
                `;

                const results = await executeSemanticQuery(semanticStore, sparql, {
                  enableSemantic: true,
                  similarityThreshold: 0.5,
                  maxResults: 10,
                });

                expect(results).toBeInstanceOf(Array);
                expect(results.length).toBeGreaterThan(0);
                expect(results.some(item => item.object?.value === 'Alice')).toBe(true);
              });

          """,
          )

          replace_between(
              'packages/cli/src/cli/commands/doctor/checks/quality.mjs',
              'function checkSkippedTests() {\n',
              '/**\n * Check Definition of Done criteria',
              """function stripNonCode(content) {
            let state = 'code';
            let quote = null;
            let result = '';
            for (let index = 0; index < content.length; index += 1) {
              const char = content[index];
              const next = content[index + 1];
              if (state === 'line-comment') {
                if (char === '\\n') { state = 'code'; result += '\\n'; }
                else result += ' ';
                continue;
              }
              if (state === 'block-comment') {
                if (char === '*' && next === '/') { result += '  '; index += 1; state = 'code'; }
                else result += char === '\\n' ? '\\n' : ' ';
                continue;
              }
              if (state === 'string') {
                if (char === '\\\\') {
                  result += ' ';
                  if (index + 1 < content.length) { result += content[index + 1] === '\\n' ? '\\n' : ' '; index += 1; }
                } else if (char === quote) { result += ' '; state = 'code'; quote = null; }
                else result += char === '\\n' ? '\\n' : ' ';
                continue;
              }
              if (char === '/' && next === '/') { result += '  '; index += 1; state = 'line-comment'; }
              else if (char === '/' && next === '*') { result += '  '; index += 1; state = 'block-comment'; }
              else if (char === '"' || char === "'" || char === '`') { result += ' '; state = 'string'; quote = char; }
              else result += char;
            }
            return result;
          }

          function extractComments(content) {
            return [...content.matchAll(/\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*/g)].map(match => match[0]);
          }

          function checkSkippedTests() {
            try {
              const testFiles = glob.sync('**/*.{test.mjs,test.ts,test.js}', {
                cwd: projectRoot,
                ignore: COMMON_IGNORES,
              });
              let skippedCount = 0;
              const skippedFiles = [];
              for (const file of testFiles) {
                const content = stripNonCode(readFileSync(join(projectRoot, file), 'utf-8'));
                const matches = content.match(/\\b(?:describe|it|test)\\.skip\\s*\\(|\\b(?:xit|xdescribe)\\s*\\(/g) || [];
                if (matches.length > 0) {
                  skippedCount += matches.length;
                  skippedFiles.push({ file, count: matches.length });
                }
              }
              if (skippedCount === 0) {
                return { status: 'pass', actual: 'No skipped tests', expected: 'All tests active' };
              }
              return {
                status: 'warn',
                actual: `${skippedCount} skipped test(s) in ${skippedFiles.length} file(s)`,
                expected: 'All tests active',
                violations: skippedFiles.slice(0, 10),
                fix: 'Review and unskip or explicitly classify each exclusion',
              };
            } catch (error) {
              return {
                status: 'warn',
                actual: `Could not check skipped tests: ${error.message}`,
                expected: 'All tests active',
                fix: 'Review test files for executable skip syntax',
              };
            }
          }

          """,
          )
          replace_between(
              'packages/cli/src/cli/commands/doctor/checks/quality.mjs',
              'function checkDefinitionOfDone() {\n',
              '/**\n * Run all quality checks',
              """function checkDefinitionOfDone() {
            try {
              const srcFiles = glob.sync('packages/**/*.mjs', {
                cwd: projectRoot,
                ignore: [...COMMON_IGNORES, '**/test/**', '**/examples/**', '**/playground/**'],
              });
              let deferredCount = 0;
              let consoleLogCount = 0;
              const violations = [];
              for (const file of srcFiles) {
                const content = readFileSync(join(projectRoot, file), 'utf-8');
                const comments = extractComments(content).join('\\n');
                const deferred = comments.match(/\\b(?:TODO|FIXME|HACK|XXX)\\b\\s*:/gi) || [];
                if (deferred.length > 0) {
                  deferredCount += deferred.length;
                  violations.push(`${file}: ${deferred.length} deferred marker(s)`);
                }
                if (!file.includes('cli/commands') && !file.includes('bin/')) {
                  const code = stripNonCode(content);
                  const logs = code.match(/console\\.log\\s*\\(/g) || [];
                  if (logs.length > 0) {
                    consoleLogCount += logs.length;
                    violations.push(`${file}: ${logs.length} console.log(s)`);
                  }
                }
              }
              if (deferredCount === 0 && consoleLogCount === 0) {
                return { status: 'pass', actual: 'No deferred markers or rogue console.logs', expected: 'Clean production code' };
              }
              return {
                status: 'warn',
                actual: `${deferredCount} deferred marker(s), ${consoleLogCount} console.logs found`,
                expected: 'Zero deferred markers and console.logs in production core',
                violations: violations.slice(0, 10),
                fix: 'Resolve deferred markers and replace console.log with the package logger',
              };
            } catch (error) {
              return {
                status: 'warn',
                actual: `Could not check Definition of Done: ${error.message}`,
                expected: 'Clean production code',
                fix: 'Run the repository WIP audit and inspect the reported source locations',
              };
            }
          }

          """,
          )
          PY
          rm .github/workflows/finish-unrdf-wip-transport.yml

      - name: Syntax and patch integrity
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/audit-wip.mjs
          node --check packages/kgc-4d-playground/lib/server/multiverse.mjs
          node --check packages/kgc-4d-playground/app/api/multiverse/merge/route.mjs
          node --check packages/kgc-4d-playground/lib/server/multiverse.test.mjs
          node --check packages/kgc-swarm/src/consensus/distributed-orchestrator.mjs
          node --check packages/kgc-swarm/test/consensus/distributed-orchestrator.test.mjs
          node --check packages/kgc-4d/test/4d-time-travel-validation.test.mjs
          node --check packages/core/test/sparql/semantic-query.test.mjs
          node --check packages/daemon/test/verify-integration-quality.mjs
          node --check packages/cli/src/cli/commands/doctor/checks/quality.mjs
          git diff --check

      - name: Install exact workspace dependencies
        shell: bash
        env:
          HUSKY: '0'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@8.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Execute bounded closure proofs
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @unrdf/kgc-4d-playground test -- lib/server/multiverse.test.mjs
          pnpm --filter @unrdf/kgc-swarm test -- test/consensus/distributed-orchestrator.test.mjs
          pnpm --filter @unrdf/kgc-4d test -- test/4d-time-travel-validation.test.mjs
          pnpm --filter @unrdf/core test -- test/sparql/semantic-query.test.mjs
          node scripts/audit-wip.mjs --json | tee /tmp/unrdf-wip-audit.json

      - name: Upload audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: unrdf-wip-audit
          path: /tmp/unrdf-wip-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit exact closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close remaining executable WIP markers'
          git push origin HEAD:${GITHUB_REF_NAME}
