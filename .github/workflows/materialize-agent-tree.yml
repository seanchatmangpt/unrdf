name: Materialize agent tree

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/fix-all-packages
      - agent/finish-unrdf-wip
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Create dependency-free source archive
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > MATERIALIZED_HEAD_SHA
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.artifacts \
            --exclude=coverage \
            --exclude='**/dist' \
            -czf /tmp/unrdf-agent-tree.tar.gz .

      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: unrdf-agent-tree-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/unrdf-agent-tree.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
